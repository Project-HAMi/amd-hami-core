name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no GPU required)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and run host-side unit tests
        run: |
          set -eu
          san="-Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all"
          for t in test_alloc_tracker test_env_policy test_memory_size; do
            gcc $san -o /tmp/$t test/$t.c -I src/hip
            /tmp/$t
          done
          for t in test_reserve test_shrreg test_init; do
            gcc -O2 $san -pthread -o /tmp/$t test/$t.c src/multiprocess/hip_multiprocess_memory_limit.c
            /tmp/$t
          done

      # The shared region is reached from many threads at once; a data race
      # there loses or double counts memory, so the threaded tests also run
      # under ThreadSanitizer (it exits non-zero on any report).
      - name: Run threaded tests under ThreadSanitizer
        run: |
          set -eu
          for t in test_reserve test_init; do
            gcc -O1 -g -fsanitize=thread -pthread -o /tmp/${t}_tsan test/$t.c src/multiprocess/hip_multiprocess_memory_limit.c
            /tmp/${t}_tsan
          done

  build:
    name: Build libamvgpu.so (ROCm ${{ matrix.rocm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rocm: "6.2"
            image: rocm/dev-ubuntu-22.04:6.2@sha256:51e0238aaa3aa04c21e13a681194e66d44c653c1005c421b90fcd188d8369549
          - rocm: "7.2"
            image: rocm/dev-ubuntu-24.04:7.2@sha256:749f9ee120c739682cc2e1553e62632c2676f98bc49e4d8133f380e0af682bcc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Dockerfile.hip's builder stage already fails the build if the glibc
      # baseline regresses or the LD_AUDIT symbols go missing, so a green
      # build here is the actual regression check, not just "it compiled".
      - name: Build and verify
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.hip
          build-args: ROCM_IMAGE=${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=rocm-${{ matrix.rocm }}
          cache-to: type=gha,mode=max,scope=rocm-${{ matrix.rocm }}

  glibc-abi-check:
    name: glibc ABI baseline check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build default image and export dist/
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.hip
          target: output
          push: false
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=rocm-6.2

      - name: Run glibc ABI check script
        run: test/check_glibc_abi.sh dist/libamvgpu.so
