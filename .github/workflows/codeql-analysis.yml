name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # to upload CodeQL results
      packages: read
      actions: read
      contents: read
    if: github.repository == 'Project-HAMi/amd-hami-core'
    # CodeQL's autobuild does not know about Makefile.hip, which links
    # CMakeLists.txt.hip in as the build file, so build manually inside a ROCm
    # image that has ROCM_HOME set up for Makefile.hip.
    container:
      image: rocm/dev-ubuntu-22.04:6.2@sha256:51e0238aaa3aa04c21e13a681194e66d44c653c1005c421b90fcd188d8369549
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake build-essential

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: cpp

      - name: Build libamvgpu.so
        run: make -f Makefile.hip clean all

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:cpp"
