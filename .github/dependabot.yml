version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependabot reads only literal FROM lines, so the ROCm images CI pins
  # live in .github/rocm/*.Dockerfile and the workflows read them from there.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.github/rocm"
    schedule:
      interval: "weekly"
